<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GeneRefine</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>GeneRefine</h1>
      <button class="btn primary" id="openModalBtn">📂 Open TSV</button>

      <svg
        xmlns="http://www.w3.org/2000/svg"

      >
        <title xmlns="">divider-tall-16-filled</title>
        <path

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1em"
        height="1em"
        viewBox="0 0 16 16"
      >
        <title xmlns="">divider-tall-16-filled</title>
        <path
          fill="currentColor"
          d="M7.75 1a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-1.5 0V1.75A.75.75 0 0 1 7.75 1"
        />
      </svg> 


      <div class="dropdown-wrap">
        <button class="btn dropdown-trigger" id="importBtn" disabled>
          Import <span class="dropdown-caret">▾</span>
        </button>
        <div class="dropdown-menu" id="importMenu">
          <button class="dropdown-item" id="importProjectBtn" disabled>
            Import project
          </button>
          <button class="dropdown-item" id="confBtn" onclick="document.getElementById('confInput').click()">
            Import filters
          </button>
        </div>
        <input type="file" id="confInput" accept=".json" style="display: none" />

      </div>

      <div class="dropdown-wrap">
        <button class="btn dropdown-trigger" id="exportBtn" disabled>
          Export <span class="dropdown-caret">▾</span>
        </button>
        <div class="dropdown-menu" id="exportMenu">
          <button class="dropdown-item" id="exportProjectBtn" disabled>
            Export project
          </button>
          <button class="dropdown-item" id="downloadConfBtn">
            Export filters
          </button>
          <button class="dropdown-item" id="downloadBtn">
            TSV (all rows)
          </button>
          <button class="dropdown-item" id="downloadSelBtn">
            TSV (only selected)
          </button>
        </div>
      </div>

      <!-- <label class="radiol"
        ><input type="radio" id="onlyVisibleRows" checked disabled /> Export all
        visible rows</label
      >
      <label class="radiol"
        ><input type="radio" id="onlySelectedRows" disabled /> Export only
        selected rows</label
      >
      <button class="btn success" id="downloadBtn" disabled>
        ⬇️ Export TSV
      </button> -->
    </header>

    <div id="toolbar2">
      <input
        type="text"
        id="quickFilter"
        placeholder="🔍 Quick filter across all columns..."
        disabled
        class="hidden"
      />
      <label
        >Page size:
        <select id="pageSizeSel" disabled>
          <option value="0">No pagination</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
        </select>
      </label>

      <div class="col-toggle-wrap">
        <button class="btn" id="colToggleBtn" disabled>☰ Columns</button>
        <div id="colToggleMenu" class="col-toggle-menu hidden">
          <div class="col-toggle-actions">
            <button type="button" id="colSelectAll">Select all</button>
            <button type="button" id="colDeselectAll">Deselect all</button>
          </div>
          <div id="colToggleList"></div>
        </div>
      </div>
      <button class="btn" id="resetBtn" disabled>Reset Columns/Filters</button>

      <div class="spacer"></div>
      <span id="status">No file loaded</span>
    </div>

    <div class="folder-tabs hidden" id="fileTabs">
      <div class="folder-tab active" id="HOMbtn">HOM</div>
      <div class="folder-tab" id="HETbtn">HET</div>
      <div class="folder-tab" id="COMPbtn">COMP</div>
      <div class="spacer"></div>
      <span id="folder-filename"></span>
    </div>

    <div id="gridWrap">
      <div id="myGrid"></div>
    </div>

    <div id="loadModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>Load datasets</h2>

        <form id="load-form">
          <div class="modal-row">
            <label for="fileHOM">HOM <span class="required">*</span></label>
            <input
              type="file"
              id="fileHOM"
              accept=".tsv,.txt,text/tab-separated-values"
            />
          </div>

          <div class="modal-row">
            <label for="fileHET">HET <span class="required">*</span></label>
            <input
              type="file"
              id="fileHET"
              accept=".tsv,.txt,text/tab-separated-values"
            />
          </div>

          <div class="modal-row">
            <label for="fileCOMP"
              >COMP <span class="optional">(optional)</span></label
            >
            <input
              type="file"
              id="fileCOMP"
              accept=".tsv,.txt,text/tab-separated-values"
            />
          </div>
        </form>

        <div class="modal-actions">
          <button class="btn" id="modalCancelBtn">Cancel</button>
          <button class="btn primary" id="modalLoadBtn">Load</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>

    <script>
      document.querySelectorAll(".folder-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          if (tab.classList.contains("disabled")) return; // do nothing

          document
            .querySelectorAll(".folder-tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
        });
      });

      const els2 = {
        openModalBtn: document.getElementById("openModalBtn"),
        loadModal: document.getElementById("loadModal"),
        modalCancelBtn: document.getElementById("modalCancelBtn"),
      };

      els2.openModalBtn.addEventListener("click", () => {
        els2.loadModal.classList.remove("hidden");
      });

      els2.modalCancelBtn.addEventListener("click", () => {
        els2.loadModal.classList.add("hidden");
      });
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/31.3.2/styles/ag-grid.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/ag-grid/31.3.2/styles/ag-theme-alpine.min.css"
    />
  </body>
</html>
