stages:
  - lint

lint-galaxy-xml:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet planemo
    - planemo lint interactivetool_generefine.sample.xml

lint-dockerfile:
  stage: lint
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint Dockerfile

validate-citation:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet cffconvert
    - cffconvert --validate