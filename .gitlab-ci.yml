stages:
  - base-build

variables:
  BASE_IMAGE: $CI_REGISTRY_IMAGE/generefine
  BASE_IMAGE_COMMIT: ${BASE_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
  BASE_IMAGE_BRANCH: ${BASE_IMAGE}:${CI_COMMIT_REF_SLUG}

container:
  stage: base-build
  image: docker
  services:
    - name: docker:dind
      alias: dind
  script:
    - echo "Building $BASE_IMAGE_COMMIT"
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --tag "$BASE_IMAGE_COMMIT" .
    - docker tag "$BASE_IMAGE_COMMIT" "$BASE_IMAGE_BRANCH"
    - docker push --all-tags "$BASE_IMAGE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  tags:
    - dind