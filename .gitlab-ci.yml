stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY_IMAGE/generefine:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}

build_image:
  stage: build
  image: docker
  services:
    - name: docker:dind
      alias: dind
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker info
    - echo "Building $IMAGE_NAME"
    - docker build --tag "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
  tags:
    - dind