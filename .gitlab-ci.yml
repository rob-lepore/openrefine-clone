stages:
  - build

variables:
  IMAGE_NAME: generefine
  DOCKER_REGISTRY: $CI_REGISTRY_IMAGE   # oppure il tuo registry, se è esterno al GitLab

build_image:
  stage: build
  image: docker
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Building $IMAGE_NAME"
    - docker build --pull --tag "$IMAGE_NAME" .
    - docker tag "$IMAGE_NAME" "$DOCKER_REGISTRY/$IMAGE_NAME:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - docker tag "$IMAGE_NAME" "$DOCKER_REGISTRY/$IMAGE_NAME:${CI_COMMIT_REF_SLUG}"
    - docker push "$DOCKER_REGISTRY/$IMAGE_NAME:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - docker push "$DOCKER_REGISTRY/$IMAGE_NAME:${CI_COMMIT_REF_SLUG}"
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG